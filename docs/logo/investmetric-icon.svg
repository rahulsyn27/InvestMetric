<!-- InvestMetric app icon: three rising gold bars with a trend line that
     ends in a node above the tallest bar. Navy and champagne gold, as in the
     app theme. tool/make_icons.py renders the Android launcher icons from
     this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2B55"/>
      <stop offset="1" stop-color="#0B1428"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A9822F"/>
      <stop offset="0.55" stop-color="#D9B871"/>
      <stop offset="1" stop-color="#F5E3B8"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  </g>
  <!-- Centred on (512, 512); bounding box about 582 x 550. -->
  <g id="mark" transform="translate(-7 27)">
    <rect x="270" y="560" width="120" height="200" rx="30" fill="#D9B871" opacity="0.35"/>
    <rect x="452" y="460" width="120" height="300" rx="30" fill="#D9B871" opacity="0.6"/>
    <rect x="634" y="340" width="120" height="420" rx="30" fill="url(#gold)"/>
    <path d="M250 520 L420 380 L540 450 L770 250" fill="none" stroke="url(#gold)"
          stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="770" cy="250" r="40" fill="#F5E3B8"/>
  </g>
</svg>
